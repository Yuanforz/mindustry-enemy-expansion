setting.expansion-enabled.name = 敌方按玩家规则经营基地
setting.expansion-enabled.description = 总开关。敌方会自己开矿、铺管道、建工厂、兵营和炮塔，只在它自己那一侧建造。仅在艾利克尔生效。
setting.expansion-strongest.name = 最强模式
setting.expansion-strongest.description = 打开后，下面所有影响敌方强弱的设置一律按最强的值生效，不管滑块停在哪里：开局不等待、每秒规划一次、矿和工厂不限、每核心 8 座兵营、单位上限 400%、最多 200 处炮塔阵地、推进和取料距离全部拉满、顶着你的部队也照样施工，所有功能开关全开。有两类设置拉满反而更弱（电网超载比例、每段路的炮塔数），它们按测试中效果最好的值生效。资源仍然是真实的，所以它会把资源优先用在兵力上，炮塔可能比平时少。关掉后恢复成你自己设的值。不受它影响的只有三类：保证公平的规则（真实库存、科技不超过你、建造速度与你相同、必须由建造机施工）、调试面板，以及只影响流畅度的规划时限。
setting.expansion-real-stock.name = 敌方资源必须是真实的
setting.expansion-real-stock.description = 开启时，敌方核心里只有真正送进去的物资，上限和你一样由核心决定，建什么都要付钱。关闭后恢复游戏原本的做法：敌方核心永远是满的，建造不花钱。
setting.expansion-tech-limit.name = 敌方科技不超过你
setting.expansion-tech-limit.description = 开启时，敌方只建你已经研究过的方块、只造你已经解锁的兵种。关闭后它可以用模组蓝图里的一切。
setting.expansion-grace.name = 开局多久后敌方开始扩张
setting.expansion-grace.description = 从这张图开局算起。在此之前敌方只积攒物资和重建。
setting.expansion-same-speed.name = 敌方建造速度与你相同
setting.expansion-same-speed.description = 敌方建造机的建造速度和你的完全一样。游戏在这个星球上默认让敌方只有你的 0.4 倍；别的模组（比如噩梦模组的“敌方建造加速”）也可能改它。打开本项时以“和你相同”为准。
setting.expansion-direct.name = 不靠建造机、直接施工（不公平）
setting.expansion-direct.description = 默认关闭：敌方每建一块、每补回一块被你拆掉的东西，都要它的建造机飞到跟前，在射程内按你的建造速度建成；你的炮塔或作战单位在附近，建造机就不来。打开后它不用建造机，核心付得起就直接建成，你拆掉的东西会立刻回来，你只能靠断它的资源来对付。
setting.expansion-debug.name = 调试：显示敌方库存和规划状态
setting.expansion-debug.description = 正常游玩时关闭：敌方有多少物资、在修什么都不会告诉你，要靠自己侦察。想核对敌方账目、或者想知道它为什么没动时可以打开。

setting.expansion-mines.name = 敌方会开矿
setting.expansion-mines.description = 在空着的矿点架设钻机，并铺管道回核心。
setting.expansion-mines-per-core.name = 每个核心、每种矿最多几排钻机（0 = 不限）
setting.expansion-mines-per-core.description = 默认不限：地图上有多少空着的矿点它就开多少，只受电力和它付不付得起限制。
setting.expansion-row-length.name = 一排最多几台钻机
setting.expansion-plants.name = 敌方会建工厂
setting.expansion-plants.description = 硅厂以及后续科技的各种工厂，连同给它们供料的碎岩机、管道和电力。
setting.expansion-plants-per-core.name = 每个核心、每种工厂最多几座（0 = 不限）
setting.expansion-use-base-lines.name = 可以从原有基地的管道上分支
setting.expansion-use-base-lines.description = 地图自带的敌方基地里已经有运矿石和硅的管道。开启后，敌方新建的兵营和炮塔可以从这些管道上分出一路。关闭后它只用自己新铺的线。
setting.expansion-haul.name = 建造单位把堆积的产物运回核心
setting.expansion-haul.description = 原有基地的钻机和工厂产出没处去时会停工。开启后，敌方的建造单位空闲时会把这些堆积的产物运回核心，这是它在矿点已被占满的图上的主要收入。
setting.expansion-hand-mine.name = 建造单位空闲时手动采矿
setting.expansion-hand-mine.description = 和你自己的核心机一样，敌方的建造单位可以直接从岩壁上采铍和石墨带回核心。只在没有东西可建、可运的时候才采。这保证它不会因为把起始物资花光而彻底停摆。
setting.expansion-open-walls.name = 可以拆自己的墙让管道通过
setting.expansion-open-walls.description = 有的图上敌方核心被自己的墙围死。开启后它会拆掉挡路的一格墙。
setting.expansion-refit.name = 升级改造已有的设施
setting.expansion-foresight.name = 先推演再决定
setting.expansion-foresight.description = 开启后，敌方每次决定建什么之前，会用地图上实测的数据（收入、你的部队来袭强度和它炮塔的击杀速度、拿下你核心需要多少兵力、兵营出兵速度）把接下来几分钟分别按"先扩矿 / 先建炮塔 / 先建兵营 / 先整理升级"推演一遍，选能最早具备进攻条件、又不会丢家的那个。
setting.expansion-ratios.name = 按配方配比规划产能
setting.expansion-ratios.description = 开启后，敌方按兵厂、工厂、炮塔的配方算出每秒需要多少各种资源，与来源的产速比较，只为供不应求的资源扩产，而不是看核心库存。
setting.expansion-refit.description = 开启后，敌方会把已有的东西做得更好：在兵工厂前接上重构厂出更高一级的兵，给钻机通氢气或臭氧、给炮塔通水来提高效率，并在物资富余时补墙、把墙换成更硬的。用的都是你也能用的机制，受同样的科技限制。
setting.expansion-overload.name = 电网最多可以超载到
setting.expansion-overload.description = 100% 表示绝不超载：发电不够就不建。数值越高，它越愿意在电不够的地方硬建，代价是那片电网上的所有东西一起变慢。
setting.expansion-starved.name = 没有空喷口时电网最多超载到
setting.expansion-starved.description = 上一项针对还有空喷口可用的情况。当它够得着的喷口都用完了，宁可让新建筑和旧建筑共用电网、一起变慢，也比什么都不建强。设成 100% 表示任何时候都不超载。
setting.expansion-power-chain.name = 电力节点链最长多少个节点
setting.expansion-power-chain.description = 矿点离喷口或已有电网很远时，敌方会用一串光束节点把电引过去。数值越大能引得越远，花的铍也越多。

setting.expansion-yards.name = 敌方会建兵营
setting.expansion-yards.description = 兵工厂的原料由管道从它的补给线上分出来，切断管道就能让兵营停产。
setting.expansion-army.name = 敌方在游戏自带的小队 AI 之上指挥部队
setting.expansion-army.description = 小队往哪里打仍由游戏自带的小队 AI 决定。在它之上，敌方的快速单位会躲开飞来的子弹，核心机会在你外围炮塔射程边缘放便宜的墙，让炮塔把弹药耗在墙上。
setting.expansion-yards-per-core.name = 每个核心最多几座兵营
setting.expansion-yards-per-core.description = 数值越大，敌方出兵越快。
setting.expansion-unit-cap.name = 敌方每种单位的数量上限
setting.expansion-unit-cap.description = 100% 表示和你一样：基础数量加上每个核心提供的份额。达到上限后，模组建的对应兵营停工。地图原有的兵工厂不受这个限制。
setting.expansion-unit-most.name = 敌方每种单位最多多少个
setting.expansion-unit-most.description = 上一项按核心数量算，核心很多的图上会算出一个很大的数。这里再封一个顶，免得单位太多拖慢游戏。同样只管模组建的兵营。
setting.expansion-max-outposts.name = 敌方最多新建几处炮塔阵地
setting.expansion-turrets-per-stretch.name = 每段路最多几座炮塔
setting.expansion-turrets-per-stretch.description = 敌方沿它的行军路线分段布防。每段都有炮塔之后，它会回头把最靠前的几段加固到这个数量。
setting.expansion-cores.name = 允许敌方抢占核心区
setting.expansion-cores.description = 敌方新建的核心和其他核心一样，必须摧毁才能占领区块。

setting.expansion-frontier.name = 敌方的固有领地：到路程的
setting.expansion-frontier.description = 从敌方核心到你的核心算作 100%。这条线以内是它的固有领地，可以随意建造。越过这条线之后怎么办，由下面的"逐步推进"决定。
setting.expansion-creep.name = 越过固有领地后逐步向你推进
setting.expansion-creep.description = 开启时，敌方可以把建筑修到固有领地之外，但每一步都必须紧挨着它已经建成的东西：先有补给线和炮塔，才有更靠前的炮塔，一路可以推到你的基地跟前。关闭后它永远不越过固有领地。
setting.expansion-hold.name = 每一步最多离已有建筑多远
setting.expansion-hold.description = 固有领地之外，新建筑必须在它已建成的建筑这么多格以内。越小推进越稳、越慢。
setting.expansion-nerve.name = 离你的作战单位多近还施工
setting.expansion-nerve.description = 你的作战单位在这么多格以内时，敌方先不在那里施工，等它们离开再建；你的炮塔射程以内始终不建。你的管道、墙、工厂这类普通建筑不算危险，只当作路障，绕开或者架桥跨过。设为 0 表示顶着你的单位也照建。
setting.expansion-reach.name = 离核心最远在哪里开矿
setting.expansion-reach.description = 按陆路距离算。越远，能用的矿点越多，管道也越长。
setting.expansion-feed-limit.name = 一条补给支线最长多少
setting.expansion-feed-limit.description = 给兵营和炮塔供料的管道如果要比这更长，就不在那里建。

setting.expansion-build-rate.name = 施工速度
setting.expansion-build-rate.description = 只在打开了“不靠建造机、直接施工”时有用：每秒最多建成多少个方块。
setting.expansion-plan-interval.name = 每隔多久考虑下一步
setting.expansion-plan-interval.description = 上一件事建完之后，过这么久再规划下一件。
setting.expansion-patience.name = 为一件买不起的东西最多攒多久
setting.expansion-patience.description = 轮到某样东西而钱不够时，敌方会先攒钱。攒这么久还不够就先做别的。
setting.expansion-time-limit.name = 单次规划最多占用多少时间
setting.expansion-time-limit.description = 规划是在两帧之间完成的，时间到了就先放下，下次接着做。调低更流畅，调高敌方发展更快。如果连续几轮都因为超时而一无所获，它会临时把时限逐步放宽（最多到 2 倍），直到算出结果为止。
