setting.expansion-enabled.name = Enemy runs its base by the player's rules
setting.expansion-enabled.description = The main switch. The enemy opens mines, lays ducts, and builds factories, unit yards and turrets, only on its own side of the map. Erekir only.
setting.expansion-strongest.name = Strongest mode
setting.expansion-strongest.description = While on, every setting below that makes the enemy stronger or weaker counts as set to its strongest, wherever its slider stands: no wait at the start, a new plan every second, no limit on mines and factories, 8 yards to a core, unit limit 400%, up to 200 turret positions, every reach as far as it goes, building on even next to your army, and every feature switched on. Two kinds of setting are weaker at their highest (how far a power grid is overloaded, how many turrets to a stretch of the way): those count as what worked best in trials. Its resources are still real, so it spends them on its army first and may have fewer turrets than usual. Turned off, everything goes back to what you set. It leaves alone only the rules that keep the game fair (real stock, the tech limit, building at your speed, building only by builder), the debug panel, and the planning time limit, which costs frames and not strength.
setting.expansion-real-stock.name = Enemy resources have to be real
setting.expansion-real-stock.description = When on, the enemy's cores hold only what was really delivered to them, with the same limit yours have, and everything it builds is paid for. When off, the game's own way comes back: its core is always full and building costs it nothing.
setting.expansion-tech-limit.name = Enemy tech no higher than yours
setting.expansion-tech-limit.description = When on, the enemy only builds blocks you have researched and units you have unlocked. When off, it may use everything in the mod's blueprints.
setting.expansion-grace.name = Time before the enemy starts expanding
setting.expansion-grace.description = Counted from the start of the map. Until then the enemy only collects resources and rebuilds.
setting.expansion-same-speed.name = The enemy builds at your speed
setting.expansion-same-speed.description = The enemy's builders build exactly as fast as yours. On this planet the game has the enemy build at 0.4 of your speed, and other mods (such as the Nightmare mod's faster enemy building) may change it too. With this on, "the same as yours" is what goes.
setting.expansion-direct.name = Builds directly, without builders (unfair)
setting.expansion-direct.description = Off as it comes: whatever the enemy builds, and whatever it puts back after you destroyed it, takes one of its builders flying there and building it from within reach at your building speed; with your turrets or fighting units near, the builder stays away. With this on it needs no builder: a block is up the moment its core can pay, what you destroy is back at once, and all you can do about it is cut off its resources.
setting.expansion-debug.name = Debug: show enemy stock and what it is planning
setting.expansion-debug.description = Off in normal play: you are told nothing about what the enemy has or builds, and have to scout for it. Switch on to check the enemy's accounts, or to see why it is not doing something.

setting.expansion-mines.name = Enemy opens mines
setting.expansion-mines.description = Drills at free ore, with ducts back to its core.
setting.expansion-mines-per-core.name = Rows of drills for each core and each ore (0 = no limit)
setting.expansion-mines-per-core.description = No limit by default: it opens a mine wherever the map has free ore, held back only by power and by what it can pay for.
setting.expansion-row-length.name = Most drills in one row
setting.expansion-plants.name = Enemy builds factories
setting.expansion-plants.description = Silicon plants and the factories of later tech, with the crushers, ducts and power that feed them.
setting.expansion-plants-per-core.name = Factories of each kind for each core (0 = no limit)
setting.expansion-use-base-lines.name = May branch off the ducts of the base it started with
setting.expansion-use-base-lines.description = The enemy base that comes with a map already has ducts carrying ore and silicon. When on, the enemy's new yards and turrets may take a branch off those. When off, it only uses lines it laid itself.
setting.expansion-haul.name = Builders carry piled-up output to the core
setting.expansion-haul.description = The drills and factories of the base it started with stop when their output has nowhere to go. When on, idle builders carry that output to the core. On maps where all the ore is already taken this is most of its income.
setting.expansion-hand-mine.name = Builders mine by hand when idle
setting.expansion-hand-mine.description = Like your own core unit, the enemy's builders can mine beryllium and graphite straight out of a wall and carry it home. They only do it when there is nothing to build or carry. It keeps the enemy from coming to a dead stop after spending what it started with.
setting.expansion-open-walls.name = May take down its own walls to let a duct through
setting.expansion-open-walls.description = On some maps the enemy's core is walled in all the way round. When on, it removes the one wall that is in the way.
setting.expansion-refit.name = Makes what it has better
setting.expansion-foresight.name = Looks ahead before it chooses
setting.expansion-foresight.description = When on, before choosing what to build next the enemy plays the next few minutes forward from what it measures on the map (what comes in, how much of your army reaches its base and how much its turrets kill, what your core takes to bring down, how fast its yards work), once for each thing it could do first, and does the one after which it would be ready to attack soonest without losing its base.
setting.expansion-ratios.name = Plans production by recipe
setting.expansion-ratios.description = When on, the enemy adds mines and factories for what its yards, factories and turrets use a second by their recipes, against what its sources bring in; not for how full its cores are.
setting.expansion-planned-opening.name = Plans its opening as a whole
setting.expansion-planned-opening.description = When on, the enemy starts from its bare core with the fastest build order to its first unit, worked out for the whole map at once (drills, generators, crushers, furnace and yard, and the lines between them), and built by its core unit; after that it grows its base as usual.
setting.expansion-refit.description = When on, the enemy improves what it has built: it puts a refabricator in front of a fabricator for the next kind of unit, leads hydrogen or ozone to its drills and water to its turrets to make them faster, and when it has the stuff to spare adds walls and puts harder ones in the place of lesser. All of it by means the player has too, and within the same research.
setting.expansion-overload.name = How far a power grid may be overloaded
setting.expansion-overload.description = 100% means never: where there is not enough power it does not build. The higher this is, the more it builds anyway, at the price of everything on that grid slowing down together.
setting.expansion-starved.name = How far a grid may be overloaded when no vent is left
setting.expansion-starved.description = The setting above is for when there are still free vents. When every vent it can reach is taken, it lets new buildings share a grid with old ones, all running slower, rather than build nothing. 100% means never overloaded.
setting.expansion-power-chain.name = Longest chain of beam nodes
setting.expansion-power-chain.description = Where ore is far from a vent or an existing grid, the enemy brings power over with a chain of beam nodes. Higher reaches further, and costs more beryllium.

setting.expansion-yards.name = Enemy builds unit yards
setting.expansion-yards.description = What the factories build from is branched off its supply lines by duct, so cutting the ducts stops a yard.
setting.expansion-army.name = Enemy leads its army over the game's squad AI
setting.expansion-army.description = The game's own squad AI still decides where the enemy's squads go. On top of it the enemy keeps its squads at home until it is clearly the stronger (or at its unit limit, or your army has just been beaten), its quick units step out of the way of shots in flight, and its core unit makes your outlying turrets waste their ammunition: it puts cheap walls down at the edge of their reach, and flies round them carrying a block so that they fire at it.
setting.expansion-yards-per-core.name = Unit yards for each core
setting.expansion-yards-per-core.description = The higher this is, the faster the enemy turns out units.
setting.expansion-unit-cap.name = Most units of each kind the enemy may have
setting.expansion-unit-cap.description = 100% means the same as for you: a base number plus a share for every core. Once it is reached, the yards the mod built for that unit stop. The unit factories a map comes with are not held to it.
setting.expansion-unit-most.name = Most units of each kind, whatever its cores allow
setting.expansion-unit-most.description = The setting above goes by the number of cores, which on a map with many of them comes to a great many units. This is a ceiling on top of it, so that the game keeps running well. Like it, it only holds the yards the mod built.
setting.expansion-max-outposts.name = Most turret positions the enemy adds
setting.expansion-turrets-per-stretch.name = Most turrets on one stretch of the way
setting.expansion-turrets-per-stretch.description = The enemy defends the ways its army takes stretch by stretch. Once every stretch has a turret, it goes back and strengthens the furthest forward ones up to this many.
setting.expansion-cores.name = Enemy may claim core zones
setting.expansion-cores.description = A new enemy core has to be destroyed like any other before the sector is won.

setting.expansion-frontier.name = The enemy's home ground reaches this far towards you
setting.expansion-frontier.description = From the enemy's cores to yours counts as 100%. Up to this line is its home ground, where it builds freely. What happens beyond it is up to "advances step by step" below.
setting.expansion-creep.name = Advances step by step beyond its home ground
setting.expansion-creep.description = When on, the enemy may build beyond its home ground, but each step has to be right by something it has already built: supply lines and turrets first, then turrets further forward, all the way up to your base. When off, it never goes past its home ground.
setting.expansion-hold.name = Furthest one step may be from what it has
setting.expansion-hold.description = Beyond its home ground, anything new has to be within this many tiles of something it has already built. Lower is a steadier, slower advance.
setting.expansion-nerve.name = How close to your fighting units it still builds
setting.expansion-nerve.description = While units you fight with are within this many tiles, the enemy holds off building there and builds when they have gone; it never builds inside the range of your turrets. Your ducts, walls, factories and the like are no danger to it, only in the way: it goes round them or bridges over. At 0 it builds whatever your units are doing.
setting.expansion-reach.name = Furthest from a core it opens a mine
setting.expansion-reach.description = Counted over land. Further means more ore to use, and longer ducts.
setting.expansion-feed-limit.name = Longest supply branch
setting.expansion-feed-limit.description = Where the duct to feed a yard or a turret would have to be longer than this, it does not build one.

setting.expansion-build-rate.name = Building speed
setting.expansion-build-rate.description = Only of use with "builds directly" switched on: the most blocks it puts up in a second.
setting.expansion-plan-interval.name = Time between one thing and the next
setting.expansion-plan-interval.description = After the last thing is built, how long before the next is worked out.
setting.expansion-patience.name = Longest it saves up for one thing
setting.expansion-patience.description = When it is something's turn and there is not enough to pay for it, the enemy saves up. After this long it does something else first.
setting.expansion-time-limit.name = Most time one round of planning may take
setting.expansion-time-limit.description = Planning happens between two frames of the game; when the time is up it is put down and taken up again later. Lower is smoother, higher lets the enemy grow faster. When several rounds in a row run out of time with nothing to show for it, the limit is stretched step by step, up to twice as long, until one gets to its end.
expansion.posture.0 = Steady
expansion.posture.1 = Balanced
expansion.posture.2 = Aggressive
setting.expansion-posture.name = How it weighs safety against attack
setting.expansion-posture.description = What its command layer looks ahead for when it chooses what to build next. Steady: it keeps a wide margin over whatever could reach its core and puts strength and economy first. Aggressive: a thin margin, and the earliest push it can make. Balanced is in between.
